<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Table – เกมจำลองดวลการ์ด</title>
<!--
  เกมจำลองดวลการ์ดสไตล์ TCG (แฟนเมด ไม่เกี่ยวข้องกับ Konami)
  ไฟล์เดียว เปิดได้เลย / วางบน GitHub Pages ได้ทันที
  แก้การ์ดได้ที่อาร์เรย์ PK1 (มอนสเตอร์), PK1S (เวทมนตร์/อุปกรณ์/กับดัก) (การ์ดในซอง) ใน <script>
-->
<style>
:root{--mat:#10302e;--edge:#0a1f1e;--ink:#f1ead8;--mute:#8fb0a8;--brass:#c9a45c;--steel:#6f9bc4;--leaf:#8ab67a;--red:#d9644a}
*{box-sizing:border-box}
body{margin:0;background:var(--edge);color:var(--ink);font:14px/1.4 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:8px;background:var(--mat);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 6px}
h1{font:700 17px Georgia,"Noto Serif Thai",serif;margin:0;color:var(--brass);letter-spacing:.5px}
button{font:inherit;color:var(--ink);background:#1d4a45;border:1px solid var(--brass);border-radius:6px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.card:focus-visible{outline:3px solid #fff}
.side{display:flex;justify-content:space-between;align-items:baseline;padding:4px 8px;border-left:4px solid var(--brass)}
.side.opp{border-color:var(--red);flex-wrap:wrap}.side.opp .oh{flex:0 0 100%;display:flex;justify-content:center;align-items:center;min-height:27px;padding-top:2px}.side.opp .oh i{position:relative;display:block;flex:0 1 19px;min-width:6px;height:27px;border:1px solid #d9b36a;border-radius:2px;overflow:hidden;background:#140a04;margin:0 1px;box-shadow:0 1px 3px #000a}.side.opp .oh i .cb{position:absolute;inset:0}.side.opp .oh.ov i{margin:0 0 0 -7px}.side.opp .oh.ov i:first-child{margin-left:0}
.lp{font:700 22px Georgia,serif}
.meta{color:var(--mute);font-size:12px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.slot{min-height:88px;border:1px dashed #3d6b64;border-radius:8px;display:flex}
.card{flex:1;border-radius:8px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;background:#2c2412;border:2px solid var(--brass);cursor:pointer;font-size:12px}
.card b{font-size:13px}
.card small{color:#cdbf9a}
.card em{font-style:normal;font-weight:700;color:var(--brass)}
.card.def{background:#16293b;border-color:var(--steel)}
.card.def em{color:var(--steel)}
.card.sp{background:#1c3320;border-color:var(--leaf)}
.card.sp em{color:var(--leaf)}
.card.sel{outline:3px solid #fff}
.card.tgt{outline:3px solid var(--red);animation:blink .8s infinite alternate}
.slot.zpick{border:2px solid var(--red);cursor:pointer;animation:blink .8s infinite alternate}
@keyframes blink{to{outline-color:transparent}}
.hand{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.hand .card{touch-action:pan-x}.dragsrc{opacity:.35}.dragghost{box-shadow:0 8px 22px #000a;border-radius:8px}
.dropok{outline:2px dashed #7fe0b0;outline-offset:-2px}.drophov{outline:3px solid #ffd24a;background:rgba(255,210,74,.18)}
body.dragging{cursor:grabbing}
.dgask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10001;display:flex;align-items:center;justify-content:center;padding:12px}
.dgbx{background:#1c1c2a;color:#fff;border:2px solid #d9b36a;border-radius:12px;padding:12px;width:100%;max-width:320px;font:14px sans-serif}
.dgt1{font-weight:700;margin-bottom:8px;text-align:center}.dgbx button{display:block;width:100%;margin:6px 0;padding:11px;background:#2e2e48;color:#fff;border:1px solid #6a6a90;border-radius:8px;font:inherit}.dgbx button:disabled{opacity:.4}.dgbx .dgx{background:#3a2a2a}
#dgt{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1c1c2aee;color:#fff;border:1px solid #d9b36a;border-radius:10px;padding:8px 14px;font-size:13px;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s}#dgt.on{opacity:1}
.hand .card{flex:0 0 96px;min-height:96px}
.panel{background:var(--edge);border-radius:8px;padding:8px 10px;margin:6px 0}
.info{min-height:36px;margin-bottom:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.log{font-size:12px;color:var(--mute);min-height:68px}
.log div:first-child{color:var(--ink)}
.turn{text-align:center;font-size:12px;color:var(--mute);margin:4px 0}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;font:700 28px Georgia,serif}
.ov div{background:var(--mat);border:2px solid var(--brass);padding:24px 34px;border-radius:12px}
.ov button{margin-top:14px;font-size:16px}
footer{text-align:center;color:var(--mute);font-size:11px;padding:10px}
@media(prefers-reduced-motion:reduce){.card.tgt,.slot.zpick{animation:none}}
[hidden]{display:none!important}
.opv{position:fixed;inset:0;z-index:60;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.opt{color:var(--ink);font-size:14px;text-align:center;padding:0 16px}
.opk{width:200px;height:300px;position:relative}
.opb{position:absolute;inset:36px 0 0 0;background:linear-gradient(160deg,#1f6b5f,#0d3a42);border:2px solid var(--brass);border-top:0;border-radius:0 0 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 22px Georgia,serif;color:var(--brass)}
.opb span{font-size:14px}
.oph{position:absolute;top:0;left:0;right:0;height:36px;background:repeating-linear-gradient(90deg,#c9a23a,#c9a23a 6px,#a8841f 6px,#a8841f 12px);border:2px solid var(--brass);border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:#2b1d00;font-weight:700;letter-spacing:8px;z-index:2}
.ops{position:relative;width:100%;height:430px;touch-action:none}
.opc,.opx{position:absolute;left:50%;top:50%;width:100px;margin:-70px 0 0 -50px;transform:scale(2.5)}
.opc{touch-action:none;cursor:grab;animation:opfi .25s}
.opx{height:140px;transform:translate(14px,10px) scale(2.4);background:repeating-linear-gradient(45deg,#3a2a14,#3a2a14 6px,#2c2412 6px,#2c2412 12px);border:2px solid #8a6a2a;border-radius:5px;opacity:.8}
@keyframes opfi{from{opacity:0}}
.opr{position:absolute;top:100%;left:-10px;right:-10px;margin-top:5px;text-align:center;font:700 7px Georgia,serif;letter-spacing:.5px;color:#cfd8dc}
.opr.R{color:#6ab7ff}.opr.SR{color:#c58cff}.opr.UR{color:#ffd24a;text-shadow:0 0 4px #ffb300}
.row.z6{grid-template-columns:repeat(6,1fr);gap:4px}
.z6 .slot{min-height:88px;border-radius:6px}
.row.z7{grid-template-columns:.8fr repeat(5,1fr) .8fr;gap:3px}
.zn{flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:9px;color:var(--mute);border-style:solid;line-height:1.25;padding:2px;overflow:hidden}
.zn .zc{font-size:14px;color:#fff}.zn small{font-size:8px;word-break:break-word}
.zn.dk{border-color:#a8642a}.zn.ex{border-color:#7a52c8}.zn.gy{border-color:#9a9a9a}
.turn.mid{display:flex;justify-content:space-between;align-items:center;gap:4px}
.turn.mid>span:nth-child(2){flex:1;font-size:11px}
.bnz{font-size:9px;border:1px solid #9a9a9a;border-radius:5px;padding:3px 5px;white-space:nowrap}
.z6 .card{padding:3px;font-size:9px;border-radius:6px;overflow:hidden}
.z6 .card b{font-size:10px;word-break:break-word}
.z6 .art{height:24px;margin:1px 0}
.z6 .card small{font-size:8px}
/* ช่องสนามเป็นสี่เหลี่ยมจัตุรัส: การ์ดตั้งกับการ์ดนอนตะแคงมีขนาดเท่ากัน (หมุน 90° แล้วพอดีช่อง) */
.z7 .slot{min-height:0;aspect-ratio:1/1}
.z7 .slot.zn,.z7 .slot.fz{aspect-ratio:auto;min-height:0}
.z7 .slot[data-p] .card,.z7 .slot[data-bp] .card{flex:none;width:68.6%;margin:0 auto;padding:2px;font-size:8px;border-radius:4px}
.z7 .slot .card b{font-size:8px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.z7 .slot .card small{display:none}
.z7 .slot .card em{font-size:8px}
.z7 .slot .card .art{height:18px;margin:1px 0}
.z7 .slot .card.def{transform:rotate(90deg)}
.slot.fz{border-style:solid;border-color:var(--brass);align-items:center;justify-content:center}
.zl{font-size:9px;color:var(--mute);text-align:center}
.card.eqp{background:#1c3320;border-color:var(--leaf)}
.card.fd{background:repeating-linear-gradient(45deg,#3a2a14,#3a2a14 6px,#2c2412 6px,#2c2412 12px);border-color:#8a6a2a}
.mn{display:grid;gap:10px;margin:14px 0}.mn button{padding:14px;font-size:16px}
.bat{display:inline-flex;gap:3px;vertical-align:middle;margin:0 6px}.bat i{width:20px;height:11px;border:1px solid var(--brass);border-radius:2px}.bat i.on{background:var(--leaf);border-color:var(--leaf)}
.qr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #24406b55}.qt{flex:1;display:flex;flex-direction:column;gap:3px}.qbar{height:5px;background:#0b1220;border-radius:3px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--brass)}.qr button:disabled{opacity:.4;cursor:default}
.pav{display:inline-block;vertical-align:middle;width:30px;height:24px;border-radius:4px;overflow:hidden;margin-right:5px;border:1px solid #d9b36a;background:#222}.pav .art{height:100%;margin:0;border:0;border-radius:0}
.pfc{display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid var(--brass)}.pfc2{display:flex;align-items:center;gap:10px;margin-top:8px}
.pfa{flex:0 0 56px;width:56px;height:46px;border-radius:6px;overflow:hidden;border:2px solid var(--brass);background:#222;display:flex;align-items:center;justify-content:center}.pfa.big{flex-basis:84px;width:84px;height:68px}.pfa .art{width:100%;height:100%;margin:0;border:0}.pfn{font:700 22px Georgia,serif;color:var(--mute)}
.pfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px;max-height:50vh;overflow:auto}.pfg .mc{aspect-ratio:auto;min-height:112px;font-size:10px;gap:2px}.pfg .mc .art{flex:1 1 40px;min-height:40px}
.big{font:700 28px Georgia,serif;color:var(--brass);text-align:center;margin:18px 0 4px;letter-spacing:1px}
.rw{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1d4a45}.rw span{flex:1}
.rw button{padding:2px 12px}
input{font:inherit;background:var(--edge);color:var(--ink);border:1px solid var(--brass);border-radius:6px;padding:8px;width:100%}
.note{white-space:pre-wrap;color:var(--leaf);margin:8px 0}.bad{color:var(--red)}

/* ---- จัดเด็คสไตล์ Master Duel + ซองการ์ด ---- */
main.wide{background:linear-gradient(#0d1526,#0a101c)}
.mc{position:relative;aspect-ratio:3/4.2;border-radius:5px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:10px;line-height:1.2;overflow:hidden;border:2px solid #0006}
.mc.mo{background:linear-gradient(#e0bb62,#a9812f);color:#2a1d05}
.mc.sp{background:linear-gradient(#1f9d8a,#13695d);color:#fff}
.mc.rare{border-color:#fff;box-shadow:0 0 0 2px #7fe3ff88,0 0 10px #7fe3ff}
.mc.sel{outline:3px solid #3fd0f0;outline-offset:1px}
.mc.mx{opacity:.45}
.mc i{font-style:normal;font-weight:700}
.at{display:inline-block;padding:0 4px;margin:0 2px;border-radius:7px;font-size:9px;font-weight:700;color:#fff;line-height:14px;vertical-align:middle;text-shadow:0 1px 1px #0008}
.at-LIGHT{background:#c9a21a}.at-DARK{background:#6a3a9a}.at-EARTH{background:#8a5a2a}.at-WATER{background:#2a78c8}.at-FIRE{background:#d4401a}.at-WIND{background:#2f9a4a}
.mc b{font-size:11px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc em{font-style:normal;font-weight:700;text-align:right}
.mc u{position:absolute;top:2px;right:2px;background:#0b1220dd;color:#fff;padding:0 5px;border-radius:8px;text-decoration:none;font-weight:700}
.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pool.dkd{grid-template-columns:repeat(6,1fr)}
.dkgrid{display:grid;gap:8px}
.dkinfo,.dkmain,.dkpool{background:#121c30;border:1px solid #24406b;border-radius:10px;padding:8px}
.dkinfo{position:sticky;top:0;z-index:2}
.dt{display:flex;gap:10px;align-items:flex-start;min-height:56px}.dt .mc{flex:0 0 78px}
.stat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.stat span{background:#0b1220;border:1px solid #24406b;border-radius:12px;padding:2px 10px;font-size:12px}
.ok{color:#7fe3a0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.tabs button.on{background:#3fd0f0;color:#06222b;border-color:#3fd0f0}
.pk{display:flex;gap:12px;align-items:center}
.pkart{flex:0 0 84px;aspect-ratio:3/4.4;border-radius:6px;background:linear-gradient(160deg,#3fd0f0,#2b4fb8 55%,#16213f);border:2px solid #d8b25a;display:flex;flex-direction:column;justify-content:center;align-items:center;font:700 12px Georgia,serif;color:#fff;text-align:center}
.pkart span{font-size:26px;color:#ffe9a8}
.pkart.cv{background:none;border:0;display:block;aspect-ratio:2/3;flex:0 0 96px}.pkart.cv.box{flex:0 0 150px;aspect-ratio:535/370}
.pkart.cv svg,.opb.cv svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 5px #000a)}
.opb.cv{inset:0;background:none;border:0;border-radius:0}
summary{cursor:pointer}
@media(min-width:900px){
 main.wide{max-width:1100px}
 .dkgrid{grid-template-columns:230px 1fr 330px;align-items:start}
 .dkinfo{top:8px}
 .pool.dkd{grid-template-columns:repeat(8,1fr)}
 .dkpool .pool{grid-template-columns:repeat(3,1fr)}
}
.mc .art{flex:1;min-height:0;border-radius:3px;overflow:hidden;margin:2px 0;border:1px solid #0006}
.art svg{display:block;width:100%;height:100%}
.card .art{height:34px;flex:none;border-radius:4px;overflow:hidden;margin:2px 0}
/* ---- กับดัก ---- */
.mc.tr{background:linear-gradient(#a0407a,#6a1f52);color:#fff}
.card.tr{background:#331a30;border-color:#b0508a}
.card.tr em{color:#d080b0}
/* ---- มอนสเตอร์หลอมรวม (กรอบม่วง) ---- */
.card.fu,.card.fu.def{background:#2a1a45;border-color:#a070d0}
.card.fu small{color:#cbb4ec}
.card.fu em,.card.fu.def em{color:#c8a0f0}
.mc.fu{background:linear-gradient(#9a72c8,#5a3a8a);color:#fff}
.dc.fu{background:linear-gradient(#9a72c8,#5a3a8a);color:#fff}
/* ---- มอนสเตอร์เอฟเฟกต์ (กรอบน้ำตาล/ส้ม) ---- */
.card.efm,.card.efm.def{background:#3a2210;border-color:#c9843a}
.card.efm small{color:#ecc9a0}
.card.efm em,.card.efm.def em{color:#f0a860}
.mc.efm{background:linear-gradient(#c8844a,#8a4a1f);color:#fff}
.dc.efm{background:linear-gradient(#c8844a,#8a4a1f);color:#fff}
/* ---- หน้าต่างรายละเอียดการ์ด (แตะ 2 ครั้ง) ---- */
html,body,button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card,.slot{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.dov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.dc{width:min(330px,100%);max-height:100%;overflow:auto;border-radius:10px;padding:10px;border:3px solid #0008;box-shadow:0 0 24px #000}
.dc.mo{background:linear-gradient(#e0bb62,#a9812f);color:#2a1d05}
.dc.sp{background:linear-gradient(#1f9d8a,#13695d);color:#fff}
.dc.tr{background:linear-gradient(#a0407a,#6a1f52);color:#fff}
.dc .nm{font:700 18px Georgia,"Noto Serif Thai",serif;margin:0}
.dc .stars{text-align:right;color:#d8301a;letter-spacing:1px;font-size:15px;min-height:18px;text-shadow:0 0 1px #000}
.dc .art{height:150px;margin:6px 0;border:2px solid #0007;border-radius:4px;overflow:hidden}
.dc .ty{font-weight:700;font-size:13px;background:#fff7;border-radius:4px;padding:2px 8px;margin-top:6px;color:#111}
.dc .ef{background:#fffc;color:#1a1408;border-radius:4px;padding:8px;margin-top:6px;white-space:pre-wrap;font-size:13px}
.dc .st{text-align:right;font:700 15px Georgia,serif;margin-top:6px}
.xv{width:min(360px,100%);max-height:100%;overflow:auto;background:#1a1408;border:3px solid #a070d0;border-radius:10px;padding:10px;color:#fff}
.xv .nm{font:700 16px Georgia,"Noto Serif Thai",serif;margin-bottom:8px}.xv .hint{text-align:center;font-size:11px;opacity:.75;margin-top:8px}
.xv .pool{grid-template-columns:repeat(3,1fr)}
.mc.back{background:repeating-linear-gradient(45deg,#5a3a14,#5a3a14 6px,#3a2a14 6px,#3a2a14 12px);color:#fff;align-items:center;justify-content:center;border-color:#a8642a}
.dc .hint{text-align:center;font-size:11px;opacity:.75;margin-top:8px}

/* ---- หลังการ์ด + สุสาน ---- */
.cb{display:block}.cb svg{display:block;width:100%;height:100%}
.mc.back{padding:0;background:#140a04;border-color:#d9b36a}
.mc.back .cb{position:absolute;inset:0}
.card.cbk{padding:0!important;background:#140a04;border-color:#d9b36a;overflow:hidden}
.card.cbk .cb{flex:1;width:100%;height:100%}

.slot{position:relative}.card.trb{opacity:.5;filter:grayscale(.8)}.chb{position:absolute;top:-8px;right:-8px;z-index:30;width:24px;height:24px;border-radius:50%;background:#d9302a;color:#fff;border:2px solid #fff;font:700 13px/20px sans-serif;text-align:center;font-style:normal;box-shadow:0 2px 8px #000a;pointer-events:none}
.fxn{position:fixed;left:50%;width:min(92vw,380px);z-index:9999;pointer-events:none;background:linear-gradient(160deg,#1f6b5f,#0d3a42);border:2px solid var(--brass);border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px #000a,0 0 22px #c9a45c66;transform:translateX(-50%);animation:fxin 1.6s both}

@keyframes fxin{0%{opacity:0;transform:translateX(-50%) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1.05)}20%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.97)}}
.fxr{position:fixed;inset:0;width:100%;height:100%;z-index:9998;pointer-events:none}
.fxr .ln{stroke:#ff4a3a;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px #ff4a3a);stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:fxdraw .35s ease-out forwards}

.fxr .ring{fill:none;stroke:#ff4a3a;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:fxring .8s .3s ease-out forwards}
.fxr .tx{fill:#fff;stroke:#000;stroke-width:3;paint-order:stroke;font:700 13px Georgia,sans-serif;text-anchor:middle}
.fxr{animation:fxout 1.1s forwards}
@keyframes fxdraw{to{stroke-dashoffset:0}}
@keyframes fxpop{to{opacity:1}}
@keyframes fxring{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
@keyframes fxout{0%,80%{opacity:1}100%{opacity:0}}

.vsov{position:fixed;inset:0;z-index:10000;display:flex;overflow:hidden;background:#05070f;color:#fff;transition:opacity .4s}.vsov.out{opacity:0}

.vsa{width:min(34vw,150px);aspect-ratio:84/68;border:3px solid #fff8;border-radius:10px;overflow:hidden;background:#0007;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px #0008}.vsa .art{width:100%;height:100%;margin:0;border:0}.vsa .pfn{font-size:40px}

.vsc{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);font:italic 900 clamp(48px,14vw,110px)/1 Georgia,serif;color:#fff;text-shadow:0 0 18px #ffd24a,0 4px 0 #000;animation:vsvs .5s .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes vsl{from{transform:translateX(-100%)}}@keyframes vsr{from{transform:translateX(100%)}}@keyframes vsu{from{transform:translateY(-100%)}}@keyframes vsd{from{transform:translateY(100%)}}
@keyframes vslp{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes vsvs{from{opacity:0;transform:translate(-50%,-50%) scale(3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  else if(idx.length>1){const v=await askQ(p,`${nm}: เลือกมอนสเตอร์ของคู่ต่อสู้ 1 ตัวที่จะ${vb}`,idx.map(k=>({k:'m',n:G.f[q][k].n,x:G.f[q][k].fd?'(ตั้งคว่ำอยู่)':`ATK ${G.f[q][k].a} / DEF ${G.f[q][k].d}`})));if(v)j=idx[v-1]}

async function ai(){
  await nap(700);
  G.b[1].forEach(e=>{if(e&&e.tr&&e.k=='uo'&&!e.ac&&!RD()){e.ac=1;emit({t:'act',p:1,n:e.n,x:e.x,k:'trap'});log(`${who(1)}เปิดใช้กับดักต่อเนื่อง ${e.n}`)}});
  for(let i=G.hand[1].length-1;i>=0&&!G.over;i--){
    const c=G.hand[1][i];if(!c)continue;
    if(c.t=='t'){const bi=G.b[1].indexOf(null);if(bi>=0){G.hand[1].splice(i,1);G.b[1][bi]={n:c.n,k:c.k,x:c.x,tr:1};emit({t:'set',p:1});log(`${who(1)}ตั้งกับดัก 1 ใบ`);render();await nap(600)}continue}
    if(c.t=='s'&&FLD[c.k]){if(fieldNet(c.k,1)>fieldNet(G.fld,1)){setField(1,i);render();await nap(800)}continue}
    if(c.t!='s'||!usable(1,c))continue;
    if(XT[c.k]){const cn=z=>G.f[z].filter(m=>m&&TYPES[m.n]==XT[c.k]).length;if(cn(0)<=cn(1))continue}
    if(c.k=='dh'&&G.f[0].filter(Boolean).length<=G.f[1].filter(Boolean).length+1)continue;
    if(c.k=='fis'&&!G.f[0].some(m=>m&&!m.fd))continue;
    if(c.k=='spy'||c.k=='cf'||c.k=='sr')continue;
    if(c.k=='stp'&&G.f[0].filter(Boolean).length<=G.f[1].filter(Boolean).length)continue;
    if(c.k=='hst'&&G.b[0].filter(e=>e&&!e.rs).length+(G.fz[0]?1:0)<=G.b[1].filter(e=>e&&!e.rs).length+(G.fz[1]?1:0)+1)continue;
    if(c.k=='dsc'&&G.hand[1].length<3)continue;
    if(c.k=='coh'&&!G.f[0].some(m=>m&&!m.fd&&m.a>=1500))continue;
    await useSpell(1,i);render();await nap(800);
  }
  if(G.over)return render();
  const low=Math.min(99999,...G.f[1].filter(Boolean).map(m=>m.a));
  const cand=G.hand[1].map((c,i)=>({c,i}))
    .filter(x=>x.c.t=='m'&&canSummon(1,x.c)&&(x.c.l<=4||x.c.a>low))
    .sort((a,b)=>b.c.a-a.c.a)[0];
  if(cand){
    const top=Math.max(0,...G.f[0].filter(Boolean).map(m=>m.fd?1500:m.pos=='a'?m.a:m.d));
    await summon(1,cand.i,cand.c.a>=top?'a':'d');render();await nap(800);
  }
  for(let i=0;i<5;i++){ // เปิดมอนสเตอร์คว่ำเป็นท่าโจมตีถ้าไม่มีตัวไหนของผู้เล่นที่เห็นแรงกว่า
    const m=G.f[1][i];
    if(m&&m.fd&&m.can&&G.f[0].every(t=>!t||t.fd||(t.pos=='a'?t.a:t.d)<m.a)){m.fd=false;m.pos='a';m.can=true;m.nw=true;m.fl=true;log(`${who(1)}เปิด ${m.n} เป็นท่าโจมตี`);if(!(await codFx(1,m))){if(m.n=='Sandglass of Valor')hourglass(1,m);pupGain(m.id);if(FLIPM.has(m.n))flipFx(1,m)}render();await nap(700)}
  }
  G.ph=3;render();await nap(500); // Battle Phase
  for(let i=0;i<5&&!G.over&&G.n>1;i++){ // เทิร์นแรกสุดของเกม (G.n==1) โจมตีไม่ได้
    const m=G.f[1][i];if(!m||!m.can||m.pos!='a'||m.fd||swb(1)||(m.n==DKE&&G.lp[1]<=1000))continue;
    const ts=G.f[0].map((t,j)=>({t,j})).filter(x=>x.t);
    if(!ts.length||DIRECT.has(m.n))await attack(1,i,-1);
    else{
      const val=t=>t.fd?1500:t.pos=='a'?t.a:t.d;
      const ok=ts.filter(x=>m.a>val(x.t)).sort((a,b)=>val(b.t)-val(a.t))[0];
      if(!ok)continue;
      await attack(1,i,ok.j);
    }
    render();await nap(900);
  }
  if(G.over)return render();
  G.ph=4;render();await nap(500); // Main Phase 2
  G.ph=5;render();await nap(500); // End Phase
  endPhaseFx(1);
  startTurn(0);
}

function cardAt(e){

const $=id=>document.getElementById(id),$app=$('app'),$scr=$('scr');
function load(txt){
  let o=null;try{o=JSON.parse(txt!=null?txt:localStorage.getItem('duel_save_v1'))}catch(e){}
  if(txt!=null&&!(o&&typeof o=='object'&&o.col&&typeof o.col=='object'&&Number.isFinite(o.coins)))return false; // นำเข้า: ไม่ถูกต้องจะไม่ทับข้อมูลเดิม
  S=o;
  if(S&&S.col){const mv=k=>RENAME[k]||k,c={};for(const k in S.col){c[mv(k)]=(c[mv(k)]||0)+S.col[k]}S.col=c;S.deck=(S.deck||[]).map(mv);S.extra=(S.extra||[]).map(mv)}
  if(!S||!S.col)S={coins:1500,col:{},deck:[],extra:[],used:[]}; // เริ่มต้นไม่มีการ์ด ต้องซื้อซองเอง
  for(const k in S.col)if(!CARDS[k])delete S.col[k]; // ลบการ์ดที่ถูกถอดออกจากเกมแล้ว
  S.deck=(S.deck||[]).filter(n=>CARDS[n]);S.extra=(S.extra||[]).filter(n=>CARDS[n]&&FUS[n]);
  S.extra=S.extra.concat(S.deck.filter(n=>FUS[n]));S.deck=S.deck.filter(n=>!FUS[n]); // ย้ายมอนสเตอร์หลอมรวมจากเด็คหลักเข้า Extra Deck
  {const u={};S.deck=S.deck.filter(n=>{u[n]=(u[n]||0)+1;return u[n]<=Math.min(LIM(n),S.col[n]||0)})} // เด็คต้องไม่เกินจำนวนที่มี
  {const u={};S.extra=S.extra.filter(n=>{u[n]=(u[n]||0)+1;return u[n]<=Math.min(LIM(n),S.col[n]||0)}).slice(0,15)} // Extra Deck สูงสุด 15 ใบ
  if(!S.prof||typeof S.prof!='object')S.prof={name:'',card:''};S.prof.name=cleanName(S.prof.name);if(!(S.prof.card&&CARDS[S.prof.card]&&S.col[S.prof.card]>0))S.prof.card=''; // โปรไฟล์: การ์ดปกต้องยังอยู่ในคลัง
  if(!S.start1500){S.start1500=1;S.coins=Math.max(S.coins||0,1500)} // ทุกคนเริ่มที่ 1500 เหรียญ
  if(!Array.isArray(S.decks))S.decks=[];
  S.decks=S.decks.filter(d=>d&&typeof d=='object'&&typeof d.name=='string').slice(0,30).map(d=>({name:d.name.slice(0,24),deck:(Array.isArray(d.deck)?d.deck:[]).filter(n=>CARDS[n]&&!FUS[n]).slice(0,60),extra:(Array.isArray(d.extra)?d.extra:[]).filter(n=>CARDS[n]&&FUS[n]).slice(0,15)})); // เด็คที่บันทึกไว้ (ช่องเด็ค)
  qSync();save();return true;
}
function save(){try{localStorage.setItem('duel_save_v1',JSON.stringify(S))}catch(e){}}
// ---------- เควสรายวัน/รายสัปดาห์ + แบตเตอรี่ห้องเทรด ----------
// ความคืบหน้าเก็บใน S.q (บันทึกพร้อมเซฟ) · รีเซ็ตตามวันที่ในเครื่อง (เที่ยงคืน) · สัปดาห์เริ่มวันจันทร์
const DQ=[{id:'d1',t:'play',g:2,r:20,n:'เล่นดวล 2 ครั้ง'},{id:'d2',t:'win',g:1,r:30,n:'ชนะดวล 1 ครั้ง'},{id:'d3',t:'pack',g:1,r:20,n:'ซื้อซองการ์ด 1 ซอง'},{id:'d4',t:'trade',g:1,r:30,n:'เทรดการ์ดสำเร็จ 1 ครั้ง'}];
const WQ=[{id:'w1',t:'play',g:10,r:100,n:'เล่นดวล 10 ครั้ง'},{id:'w2',t:'win',g:5,r:150,n:'ชนะดวล 5 ครั้ง'},{id:'w3',t:'pack',g:8,r:120,n:'ซื้อซองการ์ด 8 ซอง'},{id:'w4',t:'trade',g:3,r:100,n:'เทรดการ์ดสำเร็จ 3 ครั้ง'}];
const BATMAX=3;
function dKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function wKey(){const d=new Date();return dKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)))}
function qSync(){ // เปลี่ยนวัน → เควสรายวันและแบตเตอรี่รีเฟรช · เปลี่ยนสัปดาห์ → เควสรายสัปดาห์รีเซ็ต
  if(!S)return;
  if(!S.q||typeof S.q!='object')S.q={};
  const q=S.q;
  if(q.d!=dKey()){q.d=dKey();q.dp={};q.dc={};q.bat=BATMAX}
  if(q.w!=wKey()){q.w=wKey();q.wp={};q.wc={}}
  if(!q.dp)q.dp={};if(!q.dc)q.dc={};if(!q.wp)q.wp={};if(!q.wc)q.wc={};
  if(!Number.isInteger(q.bat)||q.bat<0||q.bat>BATMAX)q.bat=Math.min(BATMAX,Math.max(0,q.bat|0));

function pull(k,P=PACKS[0]){
  const cm=P.com(),rr=P.rare(),r=[];
  const roll=()=>{const l=Math.random()<P.p?rr:cm;return l[Math.random()*l.length|0]};
  for(let i=0;i<k;i++){
    let n=roll();
    if(fgCt(n)>=3)n=roll(); // ครบ 3 ใบแล้ว: สุ่มใหม่ 1 ครั้ง
    const ex=fgCt(n)>=3; // ยังซ้ำอีก: ไม่เข้าคอลเลกชัน แปลงเป็นเหรียญ
    if(ex)S.coins+=EXC(n);else S.col[n]=(S.col[n]||0)+1;
    r.push({n,ex});
  }
  return r;
}

  if(P.sd){ // Starter Deck: ได้การ์ดทุกใบอย่างละ 1 (ถ้ามีครบ 3 ใบแล้วแปลงเป็นเหรียญ) ไม่มีแอนิเมชันเปิดซอง
    const r=P.all().map(n=>{const ex=fgCt(n)>=3;if(ex)S.coins+=EXC(n);else S.col[n]=(S.col[n]||0)+1;return{n,nw:!ex&&!had[n],ex}});
    save();RES=r;const gain=r.filter(x=>x.ex).reduce((t,x)=>t+EXC(x.n),0);
    return say(`ได้การ์ดครบ ${r.length} ใบ`+(gain?` · ซ้ำเกิน 3 ใบ แปลงเป็น ${gain} เหรียญ`:''));
  }
  const r=pull(P.n,P);save();
  RES=r.map(({n,ex})=>{const nw=!ex&&!had[n]&&!seen[n];seen[n]=1;return{n,nw,ex}});
  const gain=r.filter(x=>x.ex).reduce((t,x)=>t+EXC(x.n),0);

// ---------- เล่นกับคน (PeerJS) ----------
function host(){
  if(!window.Peer)return say('โหลด PeerJS ไม่ได้ (ต้องต่ออินเทอร์เน็ต)');
  if(!okDeck(S.deck,S.extra))return badDeck()
  const code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
  ROLE='host';MODE='pvp';say('กำลังสร้างห้อง…');
  peer=new Peer('duel-'+code);
  peer.on('open',()=>say('ส่งรหัสห้องนี้ให้เพื่อน:\n'+code+'\n\nรอเพื่อนเข้าร่วม…'));
  peer.on('error',e=>{if(e.type=='unavailable-id'){leave();host()}else fail(e)});
  peer.on('connection',c=>{
    if(conn){c.close();return}
    conn=c;
    c.on('data',m=>{
      if(m.t=='hello'){
        if(!okDeck(m.deck,m.extra||[]))return c.send({t:'bad'});
        OPP=m.deck;OPPX=m.extra||[];OPPPF=safeProf(m.prof);startGame();
      }else if(m.t=='act'&&G&&SCREEN=='game')act(1,m.a);
    });
    c.on('close',lost);
  });
}
function join(){
  if(!window.Peer)return say('โหลด PeerJS ไม่ได้ (ต้องต่ออินเทอร์เน็ต)');
  if(!okDeck(S.deck,S.extra))return badDeck()
  const code=$('rin').value.trim().toUpperCase();
  if(!code)return say('กรุณาใส่รหัสห้อง');
  ROLE='guest';MODE='pvp';say('กำลังเชื่อมต่อ…');
  peer=new Peer();
  peer.on('error',fail);
  peer.on('open',()=>{
    conn=peer.connect('duel-'+code,{reliable:true});
    conn.on('open',()=>{conn.send({t:'hello',deck:S.deck,extra:S.extra,prof:myProf()});say('เชื่อมต่อแล้ว รอเจ้าของห้องเริ่มเกม…')});
    conn.on('data',m=>{
      if(m.t=='state'){G=m.s;if(SCREEN!='game')go('game');render()}
      else if(m.t=='bad')fail('เด็คไม่ถูกต้อง');
    });
    conn.on('close',lost);
  });
}

  ok.onclick=()=>{if(ch.length!=k)return;ov.remove();discardAt(p,ch);render();sync()};
  bx.appendChild(ok);ov.appendChild(bx);document.body.appendChild(ov);
}

  const sec=mkSec(bx,o);

    const ch=[],cf=document.createElement('button');cf.textContent='ยืนยัน (0/2)';cf.style.cssText='margin-top:6px;padding:8px 14px';
